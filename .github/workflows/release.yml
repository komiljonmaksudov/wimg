name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.24). Uses latest tag if empty."
        required: false
        type: string

permissions:
  contents: write

jobs:
  detect-changes:
    # Decide whether iOS / Android pipelines need to run for this tag.
    # Tags that only touch web or sync code skip the native builds so
    # TestFlight + APK aren't churned for no reason.
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: filter
        run: |
          CURRENT=${GITHUB_REF#refs/tags/}
          PREV=$(git tag -l --sort=-v:refname | grep -v "^${CURRENT}$" | head -1)
          if [ -z "$PREV" ]; then
            echo "No previous tag — running all native builds"
            echo "ios=true" >> $GITHUB_OUTPUT
            echo "android=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGED=$(git diff --name-only "$PREV..HEAD")
          echo "Changed files since $PREV:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(libwimg/|wimg-ios/|scripts/build-ios|scripts/gen-xcodeproj|\.github/workflows/release\.yml)'; then
            echo "ios=true" >> $GITHUB_OUTPUT
          else
            echo "ios=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE '^(libwimg/|wimg-android/|scripts/build-android|\.github/workflows/release\.yml)'; then
            echo "android=true" >> $GITHUB_OUTPUT
          else
            echo "android=false" >> $GITHUB_OUTPUT
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2

      - name: Download SQLite amalgamation
        working-directory: libwimg/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Zig fmt check
        working-directory: libwimg
        run: zig fmt --check src/

      - name: Zig tests
        working-directory: libwimg
        run: zig build test

      - name: wimg-sync-zig fmt + tests
        working-directory: wimg-sync-zig
        run: |
          zig fmt --check src/ build.zig
          zig build test

      - name: Install web dependencies
        working-directory: wimg-web
        run: bun install --frozen-lockfile

      - name: oxfmt check
        working-directory: wimg-web
        run: bunx oxfmt --check

      - name: oxlint
        working-directory: wimg-web
        run: bunx oxlint

      - name: bun test
        working-directory: wimg-web
        run: bun test

      - name: svelte-check
        working-directory: wimg-web
        run: bun run check

      - name: Install sync dependencies
        working-directory: wimg-sync
        run: bun install --frozen-lockfile

      - name: Typecheck sync worker
        working-directory: wimg-sync
        run: bunx tsc --noEmit

  build-and-deploy-web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download SQLite amalgamation
        working-directory: libwimg/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libwimg-wasm
          path: |
            wimg-web/static/libwimg.wasm
            wimg-sync/libwimg-compact.wasm

      - name: Install web dependencies
        working-directory: wimg-web
        run: bun install --frozen-lockfile

      - name: Build web
        working-directory: wimg-web
        run: bun run build

      # No deploy step: CI never touches the VPS. wimg.mili-my.name and the
      # sync server are shipped from a Mac with ./scripts/deploy-server.sh.
      # This job still builds, so a broken web build fails the release.

  build-libwimg-ios:
    # Historical: Zig 0.15.2's build runner couldn't link on macos-26
    # (missing __availability_version_check). Keeping macos-15 for now
    # under 0.16.0 to avoid regressing the iOS build; revisit later.
    needs: [check, detect-changes]
    if: needs.detect-changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Download SQLite amalgamation
        working-directory: libwimg/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build iOS XCFramework
        run: ./scripts/build-ios.sh

      - name: Zip XCFramework
        working-directory: libwimg/build-ios
        run: zip -r libwimg.xcframework.zip libwimg.xcframework

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: libwimg-ios
          path: libwimg/build-ios/libwimg.xcframework.zip

  build-ios:
    needs: [detect-changes, build-libwimg-ios]
    if: needs.detect-changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Download XCFramework
        uses: actions/download-artifact@v8
        with:
          name: libwimg-ios
          path: artifacts

      - name: Unpack XCFramework
        run: |
          mkdir -p wimg-ios/Frameworks
          unzip -o artifacts/libwimg.xcframework.zip -d wimg-ios/Frameworks/

      - name: Bump build number
        working-directory: wimg-ios
        run: |
          BUILD_NUMBER=$(date +%s)
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $BUILD_NUMBER/g" project.yml
          echo "Build number: $BUILD_NUMBER"

      - name: Generate Xcode project
        run: ./scripts/gen-xcodeproj.sh

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project wimg-ios/wimg.xcodeproj \
            -scheme wimg \
            -destination "generic/platform=iOS" \
            -archivePath build/wimg.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -quiet

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/wimg.xcarchive \
            -exportOptionsPlist wimg-ios/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

  build-android:
    needs: [check, detect-changes]
    if: needs.detect-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Download SQLite amalgamation
        working-directory: libwimg/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build Android .so
        run: ./scripts/build-android.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: wimg-android
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      # Signed Play bundle. versionCode is a Unix timestamp so every upload is
      # strictly higher than the last, like CURRENT_PROJECT_VERSION on iOS.
      # Skipped (not failed) until the keystore secrets exist.
      - name: Build signed Play bundle
        working-directory: wimg-android
        env:
          WIMG_KEYSTORE_BASE64: ${{ secrets.WIMG_KEYSTORE_BASE64 }}
          WIMG_KEYSTORE_PASSWORD: ${{ secrets.WIMG_KEYSTORE_PASSWORD }}
          WIMG_KEY_ALIAS: ${{ secrets.WIMG_KEY_ALIAS }}
          WIMG_KEY_PASSWORD: ${{ secrets.WIMG_KEY_PASSWORD }}
        run: |
          if [ -z "$WIMG_KEYSTORE_BASE64" ]; then
            echo "::warning::WIMG_KEYSTORE_BASE64 not set, skipping the signed Play bundle"
            exit 0
          fi
          export WIMG_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$WIMG_KEYSTORE_BASE64" | base64 -d > "$WIMG_KEYSTORE_FILE"
          ./gradlew bundleRelease -PwimgVersionCode=$(date +%s)
          rm -f "$WIMG_KEYSTORE_FILE"

      # Kept out of the GitHub Release on purpose: the .aab is only for the
      # Play Console upload. Download it from the workflow run's artifacts.
      - name: Upload Play bundle
        if: hashFiles('wimg-android/app/build/outputs/bundle/release/app-release.aab') != ''
        uses: actions/upload-artifact@v7
        with:
          name: wimg-android-play
          path: wimg-android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare Android artifacts
        run: |
          mkdir -p android-artifacts
          cp libwimg/build-android/arm64-v8a/libwimg.so android-artifacts/libwimg.so
          cp wimg-android/app/build/outputs/apk/debug/app-debug.apk android-artifacts/wimg.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libwimg-android
          path: android-artifacts/

  build-sync-server:
    # Native Zig sync server (self-hosted VPS binary). Built on the Ubuntu
    # runner whose glibc matches the target Hetzner box (Ubuntu 24.04). Linked
    # against libwimg, so it needs the SQLite amalgamation present.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Download SQLite amalgamation
        working-directory: libwimg/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build sync server
        working-directory: wimg-sync-zig
        run: zig build --release=safe

      - name: Upload sync server binary
        uses: actions/upload-artifact@v7
        with:
          name: wimg-sync-server
          path: wimg-sync-zig/zig-out/bin/wimg-sync

  # The deploy-sync job is gone. wimg-sync.mili-my.name is served by the native
  # Zig server on the VPS (wimg-sync-zig/, deployed with infra/scripts/deploy.sh),
  # so redeploying the Cloudflare Worker every release shipped nothing anyone
  # used — and failed anyway: Code Mode's LOADER binding needs a paid Workers
  # plan (error 10195), which is what broke v0.9.4 and v0.9.5.
  #
  # wimg-sync/ stays in the tree as a rollback path, and its last deployed
  # version is still live on Cloudflare. Deploy it by hand if ever needed:
  #   cd wimg-sync && bunx wrangler deploy

  release:
    needs: [check, detect-changes, build-and-deploy-web, build-libwimg-ios, build-ios, build-android, build-sync-server]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: libwimg-wasm
          path: artifacts/libwimg-wasm

      - name: Download iOS artifacts
        if: needs.detect-changes.outputs.ios == 'true'
        uses: actions/download-artifact@v8
        with:
          name: libwimg-ios
          path: artifacts/libwimg-ios

      - name: Download Android artifacts
        if: needs.detect-changes.outputs.android == 'true'
        uses: actions/download-artifact@v8
        with:
          name: libwimg-android
          path: artifacts/libwimg-android

      - name: Download sync server binary
        uses: actions/download-artifact@v8
        with:
          name: wimg-sync-server
          path: artifacts/wimg-sync-server

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve tag: from input (manual dispatch), GITHUB_REF (tag push), or latest tag
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=$(git tag -l --sort=-v:refname | head -1)
          fi

          # Find the last tag that has a GitHub release (skips failed CI tags)
          PREV_TAG=""
          for t in $(git tag -l --sort=-v:refname | tail -n +2); do
            if gh release view "$t" --json tagName >/dev/null 2>&1; then
              PREV_TAG="$t"
              break
            fi
          done

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD \
              | grep -vE '^- (release|chore|ci|build): ' || echo "- Version bump")
          else
            NOTES=$(git log --pretty=format:"- %s" HEAD~20..HEAD \
              | grep -vE '^- (release|chore|ci|build): ' || echo "- Version bump")
          fi

          echo "$NOTES" > release-notes.md

          # Collect available artifacts
          ASSETS=()
          [ -f artifacts/libwimg-wasm/wimg-web/static/libwimg.wasm ] && ASSETS+=(artifacts/libwimg-wasm/wimg-web/static/libwimg.wasm)
          [ -f artifacts/libwimg-ios/libwimg.xcframework.zip ] && ASSETS+=(artifacts/libwimg-ios/libwimg.xcframework.zip)
          [ -f artifacts/libwimg-android/libwimg.so ] && ASSETS+=(artifacts/libwimg-android/libwimg.so)
          [ -f artifacts/libwimg-android/wimg.apk ] && ASSETS+=(artifacts/libwimg-android/wimg.apk)
          # Self-hosted sync server (Linux x86_64), renamed for a clear asset name.
          if [ -f artifacts/wimg-sync-server/wimg-sync ]; then
            cp artifacts/wimg-sync-server/wimg-sync wimg-sync-linux-x86_64
            ASSETS+=(wimg-sync-linux-x86_64)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${ASSETS[@]}"
