name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.24). Uses latest tag if empty."
        required: false
        type: string

permissions:
  contents: write

env:
  # Same Zig as local dev. One place to bump it for every job.
  ZIG_VERSION: 0.17.1

jobs:
  detect-changes:
    # Decide whether iOS / Android pipelines need to run for this tag.
    # Tags that only touch sync or site code skip the native builds so
    # TestFlight + APK aren't churned for no reason.
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: filter
        run: |
          CURRENT=${GITHUB_REF#refs/tags/}
          PREV=$(git tag -l --sort=-v:refname | grep -v "^${CURRENT}$" | head -1)
          if [ -z "$PREV" ]; then
            echo "No previous tag — running all native builds"
            echo "ios=true" >> $GITHUB_OUTPUT
            echo "android=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # The release commit bumps both apps' versions (release.sh): leave it out,
          # or every tag rebuilds iOS and Android even when only one changed.
          END=HEAD
          if git log -1 --format=%s HEAD | grep -q '^release: '; then END=HEAD^; fi
          # Generated translation tables change on both sides with every new text
          # (en.ts): they ship with the platform's next real change.
          CHANGED=$(git diff --name-only "$PREV..$END" | grep -vE '/(Translations\.swift|Translations\.kt)$' || true)
          echo "Changed files since $PREV:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(libwimg/|wimg-ios/|scripts/build-ios|scripts/gen-xcodeproj|\.github/workflows/release\.yml)'; then
            echo "ios=true" >> $GITHUB_OUTPUT
          else
            echo "ios=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE '^(libwimg/|wimg-android/|scripts/build-android|\.github/workflows/release\.yml)'; then
            echo "android=true" >> $GITHUB_OUTPUT
          else
            echo "android=false" >> $GITHUB_OUTPUT
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Download SQLite amalgamation
        working-directory: libwimg/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Zig fmt check
        working-directory: libwimg
        run: zig fmt --check src/

      - name: Zig tests
        working-directory: libwimg
        # ReleaseFast: compiling sqlite3.c in Debug is most of this job's time.
        run: zig build test -Doptimize=ReleaseFast

      - name: wimg-sync-zig fmt + tests
        working-directory: wimg-sync-zig
        run: |
          zig fmt --check src/ build.zig
          zig build test -Doptimize=ReleaseFast

      - name: Translation tables match i18n/en.ts
        run: |
          bun scripts/i18n-codegen.ts
          git diff --exit-code -- wimg-ios/plugins/WimgI18n wimg-android/app/src/main/java/com/wimg/app/i18n

  # No deploy step: CI never touches the VPS. The landing page and the sync
  # server are shipped from a Mac with ./scripts/deploy-server.sh.

  build-libwimg-ios:
    # Historical: Zig 0.15.2's build runner couldn't link on macos-26
    # (missing __availability_version_check). Keeping macos-15 for now
    # under Zig 0.16+ to avoid regressing the iOS build; revisit later.
    needs: [check, detect-changes]
    if: needs.detect-changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Download SQLite amalgamation
        working-directory: libwimg/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build iOS XCFramework
        run: ./scripts/build-ios.sh

      - name: Zip XCFramework
        working-directory: libwimg/build-ios
        run: zip -r libwimg.xcframework.zip libwimg.xcframework

      - name: Upload iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: libwimg-ios
          path: libwimg/build-ios/libwimg.xcframework.zip

  build-ios:
    needs: [detect-changes, build-libwimg-ios]
    if: needs.detect-changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Download XCFramework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: libwimg-ios
          path: artifacts

      - name: Unpack XCFramework
        run: |
          mkdir -p wimg-ios/Frameworks
          unzip -o artifacts/libwimg.xcframework.zip -d wimg-ios/Frameworks/

      - name: Bump build number
        working-directory: wimg-ios
        run: |
          BUILD_NUMBER=$(date +%s)
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $BUILD_NUMBER/g" project.yml
          echo "Build number: $BUILD_NUMBER"

      - name: Generate Xcode project
        run: ./scripts/gen-xcodeproj.sh

      # Without the ASC_* secrets the upload can't work; skip it with a warning
      # instead of failing the job, which would also block the GitHub Release.
      # (Secrets can't be read in `if:` directly, hence this step's output.)
      - name: Check App Store Connect secrets
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_CONTENT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ASC_* secrets missing, skipping the TestFlight upload"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install App Store Connect API key
        if: steps.asc.outputs.ok == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        if: steps.asc.outputs.ok == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project wimg-ios/wimg.xcodeproj \
            -scheme wimg \
            -destination "generic/platform=iOS" \
            -archivePath build/wimg.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -quiet

      - name: Export and upload to TestFlight
        if: steps.asc.outputs.ok == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/wimg.xcarchive \
            -exportOptionsPlist wimg-ios/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # This fresh Mac made its own "Apple Development" certificate for the
      # archive. Revoke it again, or the account fills up (Apple's limit stopped
      # v1.0.1). Only certificates in this runner's keychain, only development
      # ones; a failure here never fails the release.
      - name: Revoke this run's development certificate
        if: always() && steps.asc.outputs.ok == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          serials=$(security find-certificate -a -c "Apple Development" -p 2>/dev/null \
            | awk '/BEGIN CERT/{c=""} {c=c $0 "\n"} /END CERT/{printf "%s", c | "openssl x509 -noout -serial"; close("openssl x509 -noout -serial")}' \
            | sed 's/^serial=//' | sort -u)
          echo "development certificates on this runner: ${serials:-none}"
          ASC_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 swift scripts/asc-revoke-cert.swift $serials

  build-android:
    needs: [check, detect-changes]
    if: needs.detect-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Android NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ndk;27.2.12479018

      - name: Download SQLite amalgamation
        working-directory: libwimg/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build Android .so
        run: ./scripts/build-android.sh

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # The GitHub APK: release code signed with its own permanent key
      # (scripts/make-apk-key.sh), so each release installs over the last.
      # Fails without the key: an APK under another key can't update anyone.
      - name: Build APK
        working-directory: wimg-android
        env:
          WIMG_APK_KEYSTORE_BASE64: ${{ secrets.WIMG_APK_KEYSTORE_BASE64 }}
          WIMG_APK_KEYSTORE_PASSWORD: ${{ secrets.WIMG_APK_KEYSTORE_PASSWORD }}
        run: |
          gradle wrapper
          if [ -z "$WIMG_APK_KEYSTORE_BASE64" ]; then
            echo "::error::WIMG_APK_KEYSTORE_BASE64 not set: run scripts/make-apk-key.sh once"
            exit 1
          fi
          export WIMG_APK_KEYSTORE_FILE="$RUNNER_TEMP/apk.p12"
          echo "$WIMG_APK_KEYSTORE_BASE64" | base64 -d > "$WIMG_APK_KEYSTORE_FILE"
          ./gradlew assembleGithub -PwimgVersionCode=${{ github.run_number }}
          rm -f "$WIMG_APK_KEYSTORE_FILE"

      # Signed Play bundle. versionCode is the run counter (see below), so every
      # upload is higher than the last. Skipped (not failed) without the keystore secrets.
      - name: Build signed Play bundle
        working-directory: wimg-android
        env:
          WIMG_KEYSTORE_BASE64: ${{ secrets.WIMG_KEYSTORE_BASE64 }}
          WIMG_KEYSTORE_PASSWORD: ${{ secrets.WIMG_KEYSTORE_PASSWORD }}
          WIMG_KEY_ALIAS: ${{ secrets.WIMG_KEY_ALIAS }}
          WIMG_KEY_PASSWORD: ${{ secrets.WIMG_KEY_PASSWORD }}
        run: |
          if [ -z "$WIMG_KEYSTORE_BASE64" ]; then
            echo "::warning::WIMG_KEYSTORE_BASE64 not set, skipping the signed Play bundle"
            exit 0
          fi
          export WIMG_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$WIMG_KEYSTORE_BASE64" | base64 -d > "$WIMG_KEYSTORE_FILE"
          # The run counter, not the Unix time: Play keeps version codes below
          # 2,100,000,000 and every upload must be higher than the last, so a
          # timestamp (1.79e9) would hit the limit in 2036 (Play warned on the first upload).
          ./gradlew bundleRelease -PwimgVersionCode=${{ github.run_number }}
          rm -f "$WIMG_KEYSTORE_FILE"

      # To the closed test track "alpha", like TestFlight on iOS. Notes from
      # docs/play-whats-new/*.txt; if their "# <version>" line isn't this
      # version, it goes up as a draft (finish it in Play Console). The service
      # account may only release to testing tracks, never production.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: hashFiles('wimg-android/app/build/outputs/bundle/release/app-release.aab') != ''

      - name: Upload to Google Play (closed test)
        if: hashFiles('wimg-android/app/build/outputs/bundle/release/app-release.aab') != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON not set, upload the bundle by hand"
            exit 0
          fi
          bun scripts/play-upload.ts wimg-android/app/build/outputs/bundle/release/app-release.aab alpha

      # Kept out of the GitHub Release on purpose: the .aab is only for Play.
      # Also kept as a run artifact, for a manual upload.
      - name: Upload Play bundle
        if: hashFiles('wimg-android/app/build/outputs/bundle/release/app-release.aab') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wimg-android-play
          path: wimg-android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare Android artifacts
        run: |
          mkdir -p android-artifacts
          cp libwimg/build-android/arm64-v8a/libwimg.so android-artifacts/libwimg.so
          cp wimg-android/app/build/outputs/apk/github/app-github.apk android-artifacts/wimg.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: libwimg-android
          path: android-artifacts/

  release:
    needs: [check, detect-changes, build-libwimg-ios, build-ios, build-android]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download iOS artifacts
        if: needs.detect-changes.outputs.ios == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: libwimg-ios
          path: artifacts/libwimg-ios

      - name: Download Android artifacts
        if: needs.detect-changes.outputs.android == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: libwimg-android
          path: artifacts/libwimg-android

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve tag: from input (manual dispatch), GITHUB_REF (tag push), or latest tag
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=$(git tag -l --sort=-v:refname | head -1)
          fi

          # Find the last tag that has a GitHub release (skips failed CI tags)
          PREV_TAG=""
          for t in $(git tag -l --sort=-v:refname | tail -n +2); do
            if gh release view "$t" --json tagName >/dev/null 2>&1; then
              PREV_TAG="$t"
              break
            fi
          done

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD \
              | grep -vE '^- (release|chore|ci|build): ' || echo "- Version bump")
          else
            NOTES=$(git log --pretty=format:"- %s" HEAD~20..HEAD \
              | grep -vE '^- (release|chore|ci|build): ' || echo "- Version bump")
          fi

          echo "$NOTES" > release-notes.md

          # Collect available artifacts
          ASSETS=()
          [ -f artifacts/libwimg-ios/libwimg.xcframework.zip ] && ASSETS+=(artifacts/libwimg-ios/libwimg.xcframework.zip)
          [ -f artifacts/libwimg-android/libwimg.so ] && ASSETS+=(artifacts/libwimg-android/libwimg.so)
          [ -f artifacts/libwimg-android/wimg.apk ] && ASSETS+=(artifacts/libwimg-android/wimg.apk)

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${ASSETS[@]}"
