name: wimg
options:
  bundleIdPrefix: com.wimg
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

packages:
  WimgI18n:
    path: plugins/WimgI18n

targets:
  wimg:
    type: application
    platform: iOS
    sources:
      - path: wimg
        excludes:
          - "**/.DS_Store"
    entitlements:
      path: wimg/wimg.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wimg.app
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.wimg.app
        # iPhone only for the first App Store version (no iPad screenshots or review).
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.9.14"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W5N395VNYH
        SWIFT_OBJC_BRIDGING_HEADER: "wimg/wimg-Bridging-Header.h"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - '"Frameworks"'
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks/libwimg.xcframework/ios-arm64/Headers"
          - "$(PROJECT_DIR)/Frameworks/libwimg.xcframework/ios-arm64-simulator/Headers"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - framework: Frameworks/libwimg.xcframework
        embed: false
      - target: wimgWidget
      - package: WimgI18n
        product: WimgI18n
    info:
      path: wimg/Info.plist
      properties:
        UILaunchScreen: {}
        # libwimg encrypts sync data itself (XChaCha20-Poly1305, standard, not Apple's
        # crypto): App Store Connect asks per build; answer "standard algorithms",
        # not distributed in France (docs/app-store-listing.md).
        ITSAppUsesNonExemptEncryption: true
        CFBundleDisplayName: wimg
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: "wimg verwendet Face ID, um deine Finanzdaten zu schützen."
        NSCameraUsageDescription: "wimg nutzt die Kamera nur, um den QR-Code deines Sync-Schlüssels zu lesen."
        # Static weights from scripts/ios-fonts.py (Components/Wimg.swift → WimgFont)
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.wimg.app.digest
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  wimgWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: wimgWidget
      # Shared with the app: colour/font tokens, category ids, the widget JSON, fonts.
      - path: wimg/Components/Wimg.swift
      - path: wimg/Models/Category.swift
      - path: wimg/Services/WidgetPayload.swift
      - path: wimg/Fonts
        type: folder
    entitlements:
      path: wimgWidget/wimgWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wimg.app
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.wimg.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.9.14"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W5N395VNYH
    dependencies:
      - package: WimgI18n
        product: WimgI18n
    info:
      path: wimgWidget/Info.plist
      properties:
        CFBundleDisplayName: wimg
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Fonts/Inter-Regular.ttf
          - Fonts/Inter-Medium.ttf
          - Fonts/Inter-SemiBold.ttf
          - Fonts/Inter-Bold.ttf
          - Fonts/Manrope-Medium.ttf
          - Fonts/Manrope-SemiBold.ttf
          - Fonts/Manrope-Bold.ttf
          - Fonts/Manrope-ExtraBold.ttf
          - Fonts/JetBrainsMono-Regular.ttf
          - Fonts/JetBrainsMono-Medium.ttf

schemes:
  wimg:
    build:
      targets:
        wimg: all
    run:
      config: Debug
  wimgWidget:
    build:
      targets:
        wimgWidget: all
    run:
      config: Debug
      environmentVariables:
        - variable: _XCWidgetKind
          value: WimgWidget
          isEnabled: true
