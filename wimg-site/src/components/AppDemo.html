

<div style="position: relative; width: 390px; height: 848px; overflow: hidden; background: #FAF9F6; text-align: left">
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="BLight"  hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isUms }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Umsaetze"  hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isWk }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Wiederkehrend" variant="full" hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isSet }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Settings"  hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isBank }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Bank" screen="list" hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isSuche }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Suche"  hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isSucheRes }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Suche" state="results" hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isDetTx }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Detail"  hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isDetHz }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Detail" kind="abo" hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-if value="{{ isDetFn }}" hint-placeholder-val="{{ false }}"><div class="v" style="position: absolute; inset: 0"><dc-import name="Detail" kind="mobil" hint-size="390px,848px"></dc-import></div></sc-if>
  <sc-for list="{{ spots }}" as="s" hint-placeholder-count="3">
    <a class="hs" onClick="{{ s.go }}" aria-label="{{ s.label }}" style="left: {{ s.x }}px; top: {{ s.y }}px; width: {{ s.w }}px; height: {{ s.h }}px"></a>
  </sc-for>
  <sc-if value="{{ hint }}" hint-placeholder-val="{{ true }}"><div class="pulse" style="left: {{ hx }}px; top: {{ hy }}px; width: {{ hw }}px; height: 44px"></div></sc-if>
  <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeMenu }}" class="scrim" style="position: absolute; inset: 0; background: rgba(20,19,17,0.38)"></div>
    <div class="card" style="position: absolute; left: 16px; right: 16px; bottom: 100px; padding: 8px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 18px 50px rgba(0,0,0,0.22); display: flex; flex-direction: column">
      <a class="mi" onClick="{{ goHome }}" style="display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 14px; background: {{ bgHome }}; color: #1A1A1A; cursor: pointer; font: 600 16px Manrope, sans-serif; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></svg><span style="flex: 1">Übersicht</span><span style="opacity: {{ ckHome }}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></a><a class="mi" onClick="{{ goUms }}" style="display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 14px; background: {{ bgUms }}; color: #1A1A1A; cursor: pointer; font: 600 16px Manrope, sans-serif; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg><span style="flex: 1">Umsätze</span><span style="opacity: {{ ckUms }}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></a><a class="mi" onClick="{{ goWk }}" style="display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 14px; background: {{ bgWk }}; color: #1A1A1A; cursor: pointer; font: 600 16px Manrope, sans-serif; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"></path></svg><span style="flex: 1">Wiederkehrend</span><span style="opacity: {{ ckWk }}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></a>
      <div style="height: 1px; background: #ECE8E1; margin: 6px 14px"></div>
      <a class="mi" onClick="{{ goBank }}" style="display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 14px; background: {{ bgBank }}; color: #1A1A1A; cursor: pointer; font: 600 16px Manrope, sans-serif; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 21h18"></path></svg><span style="flex: 1">Bankverbindung</span><span style="opacity: {{ ckBank }}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></a><a class="mi" onClick="{{ goImp }}" style="display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 14px; background: {{ bgImp }}; color: #1A1A1A; cursor: pointer; font: 600 16px Manrope, sans-serif; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg><span style="flex: 1">Import</span><span style="opacity: {{ ckImp }}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></a><a class="mi" onClick="{{ goSet }}" style="display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 14px; background: {{ bgSet }}; color: #1A1A1A; cursor: pointer; font: 600 16px Manrope, sans-serif; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg><span style="flex: 1">Einstellungen</span><span style="opacity: {{ ckSet }}; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></a>
    </div>
  </sc-if>
  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <div class="toast" style="position: absolute; left: 24px; right: 24px; bottom: 96px; padding: 14px 16px; border-radius: 16px; background: #1D1C1A; color: #FFFFFF; font: 500 15px/21px Inter, sans-serif; text-align: center">{{ toastText }}</div>
  </sc-if>
</div>
