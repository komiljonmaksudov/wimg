# Einstellungen › Mitteilungen: pick a quiet time.
appId: com.wimg.app
---
- launchApp
- tapOn: "Mehr"
- tapOn: "Einstellungen"
- scrollUntilVisible:
    element: "Monatsabschluss, neue Umsätze, Preise, TAN"
    centerElement: true
- tapOn: "Monatsabschluss, neue Umsätze, Preise, TAN"
- tapOn: "22:00 – 8:00"
- assertVisible: "Ruhezeit"
